<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/Flip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lottie-web@5.12.2/build/player/lottie_light.min.js"></script>
    <script src="assets/pattern-waves.js"></script>
    <script src="assets/lordicons/icons.js"></script>
    <script src="assets/kit.js"></script>
    <link rel="stylesheet" href="assets/kit.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!-- Generated by tools/mount.py from assets/timing.json. Scenes: compositions/<id>.html (see ../README.md). -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.000" data-width="1920" data-height="1080">
      <div style="z-index: 10" id="s01" data-composition-id="s01" data-composition-src="compositions/s01.html" data-start="0.000" data-duration="5.000" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <audio id="dialogue" src="assets/audio/dialogue.wav" data-start="0" data-duration="5.000" data-track-index="5" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
