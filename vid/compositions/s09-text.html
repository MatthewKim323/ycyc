<!-- s09-text: the whip from s08 lands on iMessage via Keiki. Push onto the thread as the message goes out, hold
     through the reply, then the phone shrinks out onto the dim wave for s10's tiles. -->
<!-- sfx: t=0.50 name=msg-sent gain=0.6 -->
<!-- sfx: t=2.00 name=msg-in gain=0.6 -->
<!-- sfx: t=4.60 name=whoosh-soft gain=0.3 -->
<template>
  <style>
    #root { position: absolute; inset: 0; }
    #s09-dim { position: absolute; inset: 0; background: #000; opacity: 0.55; }
    #s09-cam { position: absolute; inset: 0; transform-origin: 0 0; }
    #s09-ph { position: absolute; left: 745px; top: 74px; width: 430px; height: 932px; }
    #s09-phone { left: 0; top: 0; }
    #s09-screen { position: relative; background: #141414; }
    #s09-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 40px;
      text-align: center; font: 500 32px/1.3 "Inter", sans-serif; color: #a1a1a1; }
  </style>
  <div id="root" data-composition-id="s09-text" data-width="1920" data-height="1080">
    <div id="s09-wrap" class="clip k-canvas" data-start="0" data-duration="5.000" data-track-index="0">
      <canvas id="s09-waves" class="k-waves"></canvas>
      <div id="s09-dim"></div>
      <div id="s09-cam">
        <div id="s09-ph">
          <div id="s09-phone" class="k-phone">
            <!-- footage: assets/footage/r9-keiki-text.mp4 -->
            <div id="s09-screen" class="k-screen"><div id="s09-label">R9 · iMessage via Keiki: log push day, bench 185 5x5</div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const D = 5.0, $ = (s) => document.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const cam = (s, px, py) => ({ scale: s, x: 960 - s * px, y: 540 - s * py });

      KIT.waves(tl, $("#s09-waves"), { from: 0, to: D, offset: 52.279 });

      // Land the whip: the phone comes in from the right, blurred, sharpening on the enter curve.
      gsap.set("#s09-cam", cam(1, 960, 540));
      tl.fromTo("#s09-ph", { x: 1700, scale: 0.966 }, { x: 0, scale: 0.966, duration: 0.45, ease: KIT.ease.enter, immediateRender: false }, 0);
      tl.fromTo("#s09-ph", { filter: "blur(10px)" }, { filter: "blur(0px)", duration: 0.3, ease: "power2.out", immediateRender: false }, 0);

      // msg-sent at 0.50: push onto the thread, then drift through the yes and the "done" reply (msg-in 2.00).
      const THREAD = 684;
      tl.fromTo("#s09-cam", cam(1, 960, 540), { ...cam(1.32, 960, THREAD), duration: 0.45, ease: "power2.inOut", immediateRender: false }, 0.5);
      tl.fromTo("#s09-cam", cam(1.32, 960, THREAD), { ...cam(1.38, 960, THREAD), duration: 3.65, ease: "sine.inOut", immediateRender: false }, 0.95);

      // Hand off to s10: the phone shrinks out (12 frames, 8px blur, power2.in), leaving the dim wave.
      tl.fromTo("#s09-ph", { scale: 0.966, opacity: 1, filter: "blur(0px)" },
        { scale: 0.58, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power2.in", immediateRender: false }, 4.6);

      window.__timelines["s09-text"] = tl;
    })();
  </script>
</template>
