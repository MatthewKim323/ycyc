  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);
      const END = 10.89, FILM = 99.786, BOOM = 5.01, SUCK = 4.61;
      const clamp01 = (v) => Math.min(1, Math.max(0, v));
      const sstep = (a, b, x) => { const u = clamp01((x - a) / (b - a)); return u * u * (3 - 2 * u); };
      const p3o = (u) => 1 - Math.pow(1 - u, 3), p3i = (u) => u * u * u;
      const expoO = gsap.parseEase("expo.out");
      const pop = KIT.springs.pop, lay = KIT.springs.layout;
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rnd = mulberry32(1305);
      const SQ = 0.62; // orbits are ellipses: screen y = circle y x 0.62

      // A: the six assistants, two per beat, from depth, from near the camera, and from the edges
      const AI = [
        { id: "claude", tx: -380, ty: -170, f: { x: -120, y: -60, z: -5200 }, beat: 0.24 },
        { id: "chatgpt", tx: 400, ty: -210, f: { x: 260, y: -120, z: 1500 }, beat: 0.24 },
        { id: "grok", tx: -690, ty: 150, f: { x: -1750, y: 320, z: 0 }, beat: 0.92 },
        { id: "gemini", tx: 660, ty: 160, f: { x: 1750, y: -40, z: -300 }, beat: 0.92 },
        { id: "perplexity", tx: 60, ty: -390, f: { x: 240, y: -1150, z: 0 }, beat: 1.60 },
        { id: "muse", tx: -40, ty: 330, f: { x: -160, y: 520, z: 1350 }, beat: 1.60 },
      ].map((a) => ({ ...a, el: $("#s13-ai-" + a.id), start: Math.max(0, a.beat - 0.45) }));
      // B: 21 apps, accelerating stagger (gaps shrink), streaking in on a spiral and orbiting the centre
      const B = [...document.querySelectorAll(".s13-b")].map((el, i, all) => {
        const n = all.length - 1;
        return { el, ti: 2.28 + 2.05 * Math.sqrt(i / n), th: rnd() * Math.PI * 2, r: 300 + rnd() * 560, z: -700 + rnd() * 950,
          r0: 1500 + rnd() * 450, w: 0.25 + rnd() * 0.45 };
      });

      // swirl: a slow drift in A, accelerating through B, a vortex in the suck-out
      const swirl = (t) => 0.04 * t + (t > 2.28 ? 0.22 * Math.pow(Math.min(t, SUCK) - 2.28, 2) + (t > SUCK ? 0.22 * 2 * (SUCK - 2.28) * (t - SUCK) : 0) : 0)
        + (t > SUCK ? 4 * Math.pow(t - SUCK, 2) : 0);
      const suck = (t) => p3i(clamp01((t - SUCK) / (BOOM - SUCK)));
      const rot = (x, y, a) => [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];

      function aiPos(a, t) {
        const u = clamp01((t - a.start) / Math.max(0.01, a.beat - a.start)), e = p3o(u);
        const cy = a.ty / SQ;
        const [rx, ry] = rot(a.tx, cy, swirl(t) - swirl(a.beat) * 0);
        const s = suck(t);
        const tx = rx * (1 - s), ty = ry * SQ * (1 - s);
        return { x: a.f.x + (tx - a.f.x) * e, y: a.f.y + (ty - a.f.y) * e, z: a.f.z * (1 - e), u, s };
      }
      function bPos(b, t) {
        const u = clamp01((t - b.ti) / 0.6), e = expoO(u);
        const th = b.th + swirl(t) + b.w * Math.max(0, t - b.ti) + (1 - e) * -1.3;
        const s = suck(t);
        const r = (b.r0 + (b.r - b.r0) * e) * (1 - s);
        return { x: Math.cos(th) * r, y: Math.sin(th) * r * SQ, z: b.z * (1 - s), u, s };
      }
      function paint(el, p, pPrev, t, visible, scaleBase) {
        if (!visible) { gsap.set(el, { opacity: 0 }); return; }
        const d = Math.hypot(p.x - pPrev.x, p.y - pPrev.y);
        const blur = Math.min(7, d / 14) + (1 - p.u) * (1 - p.u) * 10;
        const op = Math.min(1, p.u * 4) * (1 - sstep(0.72, 1, p.s));
        gsap.set(el, { x: p.x, y: p.y, z: p.z, scale: scaleBase * (1 - 0.75 * p.s), opacity: op,
          filter: `blur(${blur.toFixed(2)}px) brightness(${(1 + 1.6 * p.s).toFixed(2)})` });
      }
      function render(t) {
        const tp = t - 1 / 30;
        AI.forEach((a) => {
          const vis = t >= a.start && t < BOOM;
          const landed = clamp01((t - a.beat) / pop.dur);
          const sc = t < a.beat ? 0.86 : 0.86 + 0.14 * pop.ease(landed);
          paint(a.el, aiPos(a, t), aiPos(a, tp), t, vis, sc);
        });
        B.forEach((b) => paint(b.el, bPos(b, t), bPos(b, tp), t, t >= b.ti && t < BOOM, 1));
      }
      const clk = { t: 0 };
      tl.fromTo(clk, { t: 0 }, { t: END, duration: END, ease: "none", immediateRender: false, onUpdate: () => render(clk.t) }, 0);
      render(0);

      // camera: a slow roll through A and B; the punch on the boom (1.06 to 1.0 over 10 frames)
      const swarm = $("#s13-swarm"), cam = $("#s13-cam");
      gsap.set(swarm, { rotationZ: -3, rotationX: 6 });
      tl.fromTo(swarm, { rotationZ: -3, rotationX: 6 }, { rotationZ: 4, rotationX: -4, duration: BOOM, ease: "sine.inOut", immediateRender: false }, 0);
      gsap.set(cam, { scale: 1, transformOrigin: "50% 50%" });
      tl.fromTo(cam, { scale: 1.06 }, { scale: 1, duration: 10 / 30, ease: "expo.out", immediateRender: false }, BOOM);

      // the wave: film clock, calming to 0.4x after the boom
      const pw = window.PatternWaves ? PatternWaves.create($("#s13-waves"), { width: 1920, height: 1080, dpr: 1.5, intro: false }) : null;
      const g = (t) => { if (t <= 5.5) return t; const u = t - 5.5, x = Math.min(u, 2) / 2; return 5.5 + Math.min(u, 2) - 1.2 * (x * x * x - (x * x * x * x) / 2) + (u > 2 ? 0.4 * (u - 2) : 0); };
      if (pw) {
        const wc = { t: 0 };
        tl.fromTo(wc, { t: 0 }, { t: END, duration: END, ease: "none", immediateRender: false, onUpdate: () => pw.renderAt(FILM + g(wc.t)) }, 0);
        pw.renderAt(FILM);
      }
      tl.fromTo("#s13-dim", { opacity: 0.5 }, { opacity: 0.32, duration: 0.6, ease: "power2.out", immediateRender: false }, BOOM);

      // C: the slam (as s03): from 3.4x blurred to 1.9x at frame centre on 5.01, 2-frame white flash
      const mark = $("#s13-mark"), BIG = 1.9, DX = 960 - 795, DY = 540 - 350;
      gsap.set(mark, { opacity: 0, scale: 3.4, x: DX, y: DY, filter: "blur(16px)", transformOrigin: "50% 50%" });
      tl.fromTo(mark, { opacity: 0, scale: 3.4, filter: "blur(16px)" }, { opacity: 1, scale: BIG, filter: "blur(0px)", duration: 0.1, ease: "power3.in", immediateRender: false }, BOOM - 0.1);
      tl.fromTo(mark, { scale: BIG }, { scale: BIG * 1.035, duration: 0.6, ease: "sine.inOut", immediateRender: false }, BOOM);
      tl.fromTo(mark, { scale: BIG * 1.035, x: DX, y: DY }, { scale: 1, x: 0, y: 0, duration: lay.dur * 0.75, ease: lay.ease, immediateRender: false }, 5.69);
      tl.fromTo("#s13-flash", { opacity: 0.22 }, { opacity: 0, duration: 0.16, ease: "power2.out", immediateRender: false }, BOOM);

      // D: wordmark joins, the line word by word, the repo URL on 7.05
      gsap.set("#s13-word", { opacity: 0, x: -30, filter: "blur(8px)" });
      tl.fromTo("#s13-word", { x: -30 }, { x: 0, duration: KIT.springs.enter.dur, ease: KIT.springs.enter.ease, immediateRender: false }, 5.86);
      tl.fromTo("#s13-word", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out", immediateRender: false }, 5.86);
      KIT.words(tl, $("#s13-title"), 5.69, { gap: 0.12 });
      gsap.set("#s13-url", { opacity: 0, filter: "blur(8px)" });
      tl.fromTo("#s13-url", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power3.out", immediateRender: false }, 7.05);

      // E: still from 7.23; end by subtraction over the last 0.5 s, no final hit
      tl.fromTo("#s13-black", { opacity: 0 }, { opacity: 1, duration: 0.47, ease: "power1.in", immediateRender: false }, 10.39);

      window.__timelines["s13-end"] = tl;
    })();
  </script>
