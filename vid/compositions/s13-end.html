      <canvas id="s13-waves" class="k-waves" width="1920" height="1080"></canvas>
      <div id="s13-dim"></div>
      <div id="s13-lock">
        <div id="s13-mark" class="k-mark">yuzu</div>

      </div>
      <h1 id="s13-title" class="k-head">Your apps, in every AI.</h1>

    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);

      // the wave at full strength, calming: shader clock continues from s12 (film time) and slows to 0.4x over 2 s
      const pw = window.PatternWaves ? PatternWaves.create($("#s13-waves"), { width: 1920, height: 1080, dpr: 1.5, intro: false }) : null;
      const g = (t) => { const x = Math.min(t, 2) / 2; const a = Math.min(t, 2) - 1.2 * (x * x * x - (x * x * x * x) / 2); return t <= 2 ? a : a + 0.4 * (t - 2); };
      const clk = { t: 0 };
      if (pw) {
        tl.fromTo(clk, { t: 0 }, { t: 8, duration: 8, ease: "none", immediateRender: false, onUpdate: () => pw.renderAt(75.284 + g(clk.t)) }, 0);
        pw.renderAt(75.284);
      }
      tl.fromTo("#s13-dim", { opacity: 0.3 }, { opacity: 0.26, duration: 1.2, ease: "power2.inOut", immediateRender: false }, 0);

      // the mark lands on the downbeat at 2.28 (VO "Yuzu." at 2.20): pop spring, opacity never bounces
      const pop = KIT.springs.pop, lay = KIT.springs.layout;
      gsap.set("#s13-mark", { opacity: 0, scale: 0.3, x: 0, filter: "blur(10px)" });
      tl.fromTo("#s13-mark", { scale: 0.3 }, { scale: 1, duration: pop.dur, ease: pop.ease, immediateRender: false }, 2.08);
      tl.fromTo("#s13-mark", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power2.out", immediateRender: false }, 2.08);
      // the link joins beside it on the next beat (2.96), the mark makes room on the layout spring
      tl.fromTo("#s13-mark", { x: 0 }, { x: -120, duration: lay.dur, ease: lay.ease, immediateRender: false }, 2.96);
      gsap.set("#s13-link", { opacity: 0, scale: 0.5, x: -60 });
      tl.fromTo("#s13-link", { scale: 0.5, x: -60 }, { scale: 1, x: 0, duration: pop.dur, ease: pop.ease, immediateRender: false }, 2.96);
      tl.fromTo("#s13-link", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out", immediateRender: false }, 2.96);
      KIT.icon(tl, $("#s13-link-ic"), "link", { at: 2.96 });
      // the lockup drifts 2% until the line has landed, then everything holds still
      tl.fromTo("#s13-lock", { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.02, duration: 1.8, ease: "sine.inOut", immediateRender: false }, 2.7);

      // the line, word by word, done by 4.0; the repo URL on the 4.32 beat
      KIT.words(tl, $("#s13-title"), 3.1, { gap: 0.15 });
      gsap.set("#s13-url", { opacity: 0, filter: "blur(8px)" });
      tl.fromTo("#s13-url", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power3.out", immediateRender: false }, 4.32);

      // everything still from 4.5 to 7.5 (3 s); end by subtraction over the last 0.5 s
      tl.fromTo("#s13-black", { opacity: 0 }, { opacity: 1, duration: 0.47, ease: "power1.in", immediateRender: false }, 7.5);

      window.__timelines["s13-end"] = tl;
    })();
  </script>
