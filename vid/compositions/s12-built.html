<template>
  <!-- sfx: t=0.00 name=whoosh-soft gain=0.45 -->
  <!-- sfx: t=2.10 name=whoosh-soft gain=0.45 -->
  <!-- sfx: t=4.14 name=whoosh-soft gain=0.45 -->
  <style>
    #root { position: absolute; inset: 0; }
    #s12-dim { position: absolute; inset: 0; background: #000; opacity: 0.55; }
    .s12-card { position: absolute; left: 240px; top: 181px; width: 1440px; height: 810px; }
    .s12-push { position: absolute; inset: 0; }
    .s12-chip { top: -92px; left: 0; padding: 0 28px; }
    .s12-frame { position: absolute; inset: 0; border-radius: 48px; background: #0b0b0b; box-shadow: inset 0 0 0 1.5px #1f1f1f; padding: 24px; }
    .s12-screen { width: 100%; height: 100%; border-radius: 24px; background: #141414; display: flex; align-items: center; justify-content: center;
      font: 500 32px "Inter", sans-serif; color: #a1a1a1; }
  </style>
  <div id="root" data-composition-id="s12-built" data-width="1920" data-height="1080">
    <div id="s12-wrap" class="clip k-canvas" data-start="0" data-duration="6.000" data-track-index="0">
      <svg width="0" height="0" style="position:absolute">
        <filter id="s12-hb1" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur id="s12-hb1-k" stdDeviation="0 0" /></filter>
        <filter id="s12-hb2" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur id="s12-hb2-k" stdDeviation="0 0" /></filter>
        <filter id="s12-hb3" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur id="s12-hb3-k" stdDeviation="0 0" /></filter>
      </svg>
      <canvas id="s12-waves" class="k-waves" width="1920" height="1080"></canvas>
      <div id="s12-dim"></div>
      <div id="s12-c1" class="s12-card">
        <div id="s12-c1-push" class="s12-push">
          <div class="k-chip s12-chip">Capy</div>
          <div class="s12-frame">
            <!-- footage: assets/footage/r10a-capy.png -->
            <img id="s12-scr-a" class="k-screen s12-screen" src="assets/footage/r10a-capy.png" alt="" style="object-fit: cover; object-position: 50% 0%; padding: 0; background: #000;">
          </div>
        </div>
      </div>
      <div id="s12-c2" class="s12-card">
        <div id="s12-c2-push" class="s12-push">
          <div class="k-chip s12-chip">Revyl</div>
          <div class="s12-frame">
            <!-- footage: assets/footage/r10b-revyl.png -->
            <img id="s12-scr-b" class="k-screen s12-screen" src="assets/footage/r10b-revyl.png" alt="" style="object-fit: contain; object-position: 50% 0%; padding: 0; background: #000;">
          </div>
        </div>
      </div>
      <div id="s12-c3" class="s12-card">
        <div id="s12-c3-push" class="s12-push">
          <div class="k-chip s12-chip">Convex</div>
          <div class="s12-frame">
            <!-- footage: assets/footage/r10c-convex.png -->
            <img id="s12-scr-c" class="k-screen s12-screen" src="assets/footage/r10c-convex.png" alt="" style="object-fit: cover; object-position: 50% 0%; padding: 0; background: #000;">
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);

      KIT.waves(tl, $("#s12-waves"), { from: 0, to: 6, offset: 88.341, intro: false });
      // the wave settles back under the dim as the proof cards arrive, then lifts again for the end card
      tl.fromTo("#s12-dim", { opacity: 0.15 }, { opacity: 0.55, duration: 0.5, ease: "power2.out", immediateRender: false }, 0);
      tl.fromTo("#s12-dim", { opacity: 0.55 }, { opacity: 0.3, duration: 0.5, ease: "power2.inOut", immediateRender: false }, 5.46);

      // horizontal-only motion blur, only while a card moves
      function hblur(n, at, dur, peak, inFirst) {
        const card = $("#s12-c" + n), k = $("#s12-hb" + n + "-k");
        tl.set(card, { filter: "url(#s12-hb" + n + ")" }, at);
        if (inFirst) {
          tl.fromTo(k, { attr: { stdDeviation: `${peak} 0` } }, { attr: { stdDeviation: "0 0" }, duration: dur * 0.6, ease: "power2.out", immediateRender: false }, at);
        } else {
          tl.fromTo(k, { attr: { stdDeviation: "0 0" } }, { attr: { stdDeviation: `${peak} 0` }, duration: dur, ease: "power2.in", immediateRender: false }, at);
        }
        tl.set(card, { filter: "none" }, at + dur);
      }
      // one card at a time: in from the right (fast, long tail), slow push while it holds, out to the left (accelerating)
      const cards = [
        // cards change on the beats (scene-local 2.16, 4.20); the last one leaves on the 5.56 downbeat
        { n: 1, inAt: 0.0, outAt: 2.04 },
        { n: 2, inAt: 2.12, outAt: 4.08 },
        { n: 3, inAt: 4.16, outAt: null },
      ];
      cards.forEach(({ n, inAt, outAt }) => {
        const card = "#s12-c" + n, push = "#s12-c" + n + "-push";
        gsap.set(card, { x: 1700, opacity: 1, scale: 1 });
        tl.fromTo(card, { x: 1700 }, { x: 0, duration: 0.6, ease: "expo.out", immediateRender: false }, inAt);
        hblur(n, inAt, 0.6, 8, true);
        const holdEnd = outAt == null ? 5.46 : outAt + 0.1;
        tl.fromTo(push, { scale: 1 }, { scale: 1.045, duration: holdEnd - (inAt + 0.25), ease: "sine.inOut", immediateRender: false }, inAt + 0.25);
        if (outAt != null) {
          tl.fromTo(card, { x: 0 }, { x: -1700, duration: 0.34, ease: "power3.in", immediateRender: false }, outAt);
          hblur(n, outAt, 0.34, 8, false);
        }
      });
      // last card leaves by drawing into the centre of frame, where the yuzu mark arrives in s13
      tl.fromTo("#s12-c3", { scale: 1, opacity: 1, filter: "blur(0px)" }, { scale: 0.14, opacity: 0, filter: "blur(10px)", duration: 0.42, ease: "power3.in", immediateRender: false }, 5.46);

      window.__timelines["s12-built"] = tl;
    })();
  </script>
</template>
