  <script>
    (function () {
      const D = 8.168, S = KIT.springs, $ = (s) => document.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const swap = (outEl, inEl, at) => {
        tl.fromTo(outEl, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.1, ease: "power2.in", immediateRender: false }, at);
        tl.fromTo(inEl, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power2.out", immediateRender: false }, at + 0.06);
      };
      const pressTo = (el, at, to) => {
        tl.to(el, { scale: to, duration: 0.09, ease: S.press.ease }, at);
        tl.to(el, { scale: 1, duration: S.release.dur, ease: S.release.ease }, at + 0.1);
      };

      KIT.waves(tl, $("#s09b-waves"), { from: 0, to: D, offset: 57.284 });

      // ---------- A: the ask bar (0.00 - 2.60) ----------
      const AS = 1.27;
      gsap.set("#s09b-acam", { scale: AS, transformOrigin: "50% 50%" });
      tl.fromTo("#s09b-ask", { y: 36 }, { y: 0, duration: 0.6, ease: KIT.ease.enter, immediateRender: false }, 0);
      tl.fromTo("#s09b-ask", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power3.out", immediateRender: false }, 0);
      tl.fromTo("#s09b-acam", { scale: AS }, { scale: AS * 1.04, duration: 2.3, ease: "sine.inOut", immediateRender: false }, 0);

      // The request types in (smear, 30 cps); placeholder clears, Ask appears with the first character.
      gsap.set("#s09b-typed", { opacity: 0 });
      gsap.set("#s09b-send", { opacity: 0, scale: 0.6 });
      tl.fromTo("#s09b-ph", { opacity: 1 }, { opacity: 0, duration: 0.05, ease: "none", immediateRender: false }, 0.25);
      tl.fromTo("#s09b-typed", { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", immediateRender: false }, 0.25);
      KIT.smear(tl, $("#s09b-typed"), 0.25);
      tl.fromTo("#s09b-send", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: S.pop.ease, immediateRender: false }, 0.28);

      // Target: Claude (0.54), ChatGPT (1.22), Grok (1.90). Active = white fill, black text (the app's chipActive).
      const ON = { backgroundColor: "rgba(255,255,255,1)", color: "#000000", boxShadow: "inset 0 0 0 1.5px #ffffff" };
      const OFF = { backgroundColor: "rgba(255,255,255,0)", color: "#a1a1a1", boxShadow: "inset 0 0 0 1.5px #2a2a2a" };
      gsap.set(["#s09b-t1", "#s09b-t2", "#s09b-t3"], { ...OFF, scale: 1 });
      gsap.set(["#s09b-h1", "#s09b-h2", "#s09b-h3"], { opacity: 0 });
      const picks = [["#s09b-t1", "#s09b-h1", 0.54], ["#s09b-t2", "#s09b-h2", 1.22], ["#s09b-t3", "#s09b-h3", 1.9]];
      picks.forEach(([chip, help, at], i) => {
        tl.fromTo(chip, OFF, { ...ON, duration: 0.12, ease: "power2.out", immediateRender: false }, at);
        pressTo($(chip), at, 0.95);
        if (i > 0) {
          tl.fromTo(picks[i - 1][0], ON, { ...OFF, duration: 0.12, ease: "power2.out", immediateRender: false }, at);
          swap($(picks[i - 1][1]), $(help), at);
        } else {
          tl.fromTo(help, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power2.out", immediateRender: false }, at + 0.06);
        }
      });

      // Ask (2.24, the app's 0.92 press), then one push up: the bar leaves the top as the Link tab arrives from below
      // (same distance, same ease, so they travel as one page).
      pressTo($("#s09b-send"), 2.24, 0.92);
      tl.to("#s09b-ask", { y: -1080 / AS, duration: 0.36, ease: "power3.inOut" }, 2.28);
      tl.to("#s09b-ask", { filter: "blur(6px)", duration: 0.36, ease: "power2.in" }, 2.28);

      // ---------- B: assistants card (2.36 - 5.13) ----------
      gsap.set("#s09b-col", { y: 1080 });
      gsap.set("#s09b-dev", { opacity: 0 });
      tl.fromTo("#s09b-col", { y: 1080 }, { y: 0, duration: 0.36, ease: "power3.inOut", immediateRender: false }, 2.28);
      tl.fromTo("#s09b-col", { filter: "blur(6px)" }, { filter: "blur(0px)", duration: 0.3, ease: "power2.out", immediateRender: false }, 2.4);
      tl.fromTo("#s09b-bcam", { scale: 1 }, { scale: 1.05, duration: 5.34, ease: "sine.inOut", immediateRender: false, transformOrigin: "50% 50%" }, 2.36);

      // One assistant added a beat: How clears, the check pops (checkBlack), the caption becomes "Added".
      [2.58, 3.26, 3.94, 4.62].forEach((at, i) => {
        const n = i + 1, how = $("#s09b-r" + n + "-how"), ok = $("#s09b-r" + n + "-ok");
        gsap.set(ok, { opacity: 0, scale: 0.4 });
        gsap.set("#s09b-r" + n + "-add", { opacity: 0 });
        tl.fromTo(how, { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.9, duration: 0.12, ease: "power2.in", immediateRender: false }, at);
        tl.fromTo(ok, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: S.pop.ease, immediateRender: false }, at + 0.04);
        KIT.icon(tl, $("#s09b-r" + n + "-ic"), "check-black", { at: at + 0.04 });
        swap($("#s09b-r" + n + "-hint"), $("#s09b-r" + n + "-add"), at);
      });

      // ---------- C: scroll to "For developers", open it (card-morph), Copy -> Copied a beat ----------
      const dev = $("#s09b-dev"), head = dev.querySelector(".s9-devhead");
      const bodyH = Math.max(400, dev.offsetHeight - head.offsetHeight) || 624;
      tl.fromTo(dev, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out", immediateRender: false }, 4.74);
      tl.fromTo("#s09b-col", { y: 0 }, { y: -945, duration: 0.36, ease: "power2.inOut", immediateRender: false }, 4.78);
      tl.fromTo("#s09b-card", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, 4.8);
      tl.fromTo("#s09b-col", { filter: "blur(0px)" }, { filter: "blur(6px)", duration: 0.18, ease: "power2.in", immediateRender: false }, 4.78);
      tl.to("#s09b-col", { filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, 4.96);
      gsap.set(dev, { clipPath: "inset(0px 0px " + bodyH + "px 0px round 54px)" });
      gsap.set("#s09b-hide", { opacity: 0 });
      swap($("#s09b-show"), $("#s09b-hide"), 4.98);
      tl.fromTo(dev, { clipPath: "inset(0px 0px " + bodyH + "px 0px round 54px)" }, { clipPath: "inset(0px 0px 0px 0px round 54px)", duration: 0.42, ease: S.layout.ease, immediateRender: false }, 4.98);
      const rows = ["#s09b-d1", "#s09b-d2", "#s09b-d3", "#s09b-d4"];
      gsap.set(rows, { opacity: 0 });
      tl.fromTo(rows, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: KIT.ease.enter, stagger: 0.055, immediateRender: false }, 5.02);

      [5.3, 5.98, 6.66, 7.35].forEach((at, i) => {
        const n = i + 1;
        gsap.set("#s09b-d" + n + "-k", { opacity: 0 });
        gsap.set("#s09b-d" + n + "-b", { scale: 1 });
        KIT.press(tl, $("#s09b-d" + n + "-b"), at - 0.06);
        swap($("#s09b-d" + n + "-c"), $("#s09b-d" + n + "-k"), at);
        tl.fromTo("#s09b-d" + n + "-l", { color: "#a1a1a1" }, { color: "#ffffff", duration: 0.2, ease: "power2.out", immediateRender: false }, at);
      });

      // Exit: 12 frames, blur, power2.in, gone by 8.10 so s10 opens on the clean dim wave.
      tl.to("#s09b-bcam", { opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power2.in" }, 7.7);

      window.__timelines["s09b-any"] = tl;
    })();
  </script>
