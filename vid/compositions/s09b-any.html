      // ---------------- C: Link tab rows at speed (5.14 - 8.10) ----------------
      // Bottoms (3x px, column space) after each step; the column shows at 0.8 and keeps the newest row in frame.
      const CS = 0.8, beats = [5.3, 5.64, 5.98, 6.32, 6.66, 7.0, 7.35, 7.69];
      const bottoms = [210, 420, 630, 840, 1185, 1341, 1497, 1653];
      const topFor = (b) => { const h = CS * b; return h < 840 ? 540 - h / 2 : 960 - h; };
      gsap.set("#s09b-col", { scale: CS });
      gsap.set("#s09b-cpos", { y: topFor(210) + 1080 });
      tl.fromTo("#s09b-cpos", { y: topFor(210) + 1080 }, { y: topFor(210), duration: 0.34, ease: "power3.inOut", immediateRender: false }, 5.0);
      tl.fromTo("#s09b-cpos", { filter: "blur(6px)" }, { filter: "blur(0px)", duration: 0.24, ease: "power2.out", immediateRender: false }, 5.12);
      // Cards grow by clipping to the newest row (round 54 keeps the corners).
      const clip = (b) => "inset(0px 0px " + b + "px 0px round 54px)";
      gsap.set("#s09b-card", { clipPath: clip(840 - 210) });
      gsap.set("#s09b-dev", { clipPath: clip(783), opacity: 0 });
      const rows = ["#s09b-r1", "#s09b-r2", "#s09b-r3", "#s09b-r4", "#s09b-d1", "#s09b-d2", "#s09b-d3", "#s09b-d4"];
      gsap.set(rows.slice(1), { opacity: 0 });
      gsap.set("#s09b-dh", { opacity: 0 });
      beats.forEach((at, i) => {
        if (i > 0) {
          const land = at - 0.12;
          tl.fromTo("#s09b-cpos", { y: topFor(bottoms[i - 1]) }, { y: topFor(bottoms[i]), duration: 0.4, ease: S.layout.ease, immediateRender: false }, land);
          tl.fromTo(rows[i], { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: KIT.ease.enter, immediateRender: false }, land);
          if (i < 4) tl.fromTo("#s09b-card", { clipPath: clip(840 - bottoms[i - 1]) }, { clipPath: clip(840 - bottoms[i]), duration: 0.32, ease: S.layout.ease, immediateRender: false }, land);
          else {
            const devTop = 918, prev = i === 4 ? 0 : bottoms[i - 1] - devTop, next = bottoms[i] - devTop;
            if (i === 4) {
              tl.fromTo("#s09b-dev", { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, land);
              tl.fromTo("#s09b-dh", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: KIT.ease.enter, immediateRender: false }, land);
            }
            tl.fromTo("#s09b-dev", { clipPath: clip(783 - prev) }, { clipPath: clip(783 - next), duration: 0.32, ease: S.layout.ease, immediateRender: false }, land);
          }
        }
        if (i < 4) {
          const ok = $(rows[i] + "-ok");
          gsap.set(ok, { opacity: 0, scale: 0.4 });
          tl.fromTo(ok, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: S.pop.ease, immediateRender: false }, at);
          KIT.icon(tl, $(rows[i] + "-ic"), "check-black", { at: at, speed: 1.5 });
        } else {
          const n = i - 3;
          gsap.set("#s09b-d" + n + "-k", { opacity: 0 });
          gsap.set("#s09b-d" + n + "-b", { scale: 1 });
          KIT.press(tl, $("#s09b-d" + n + "-b"), at - 0.04);
          swap($("#s09b-d" + n + "-c"), $("#s09b-d" + n + "-k"), at);
        }
      });

      // Exit: blur + fade, power2.in, gone by 8.10 so s10 opens on the clean dim wave.
      tl.fromTo("#s09b-cpos", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, 7.8);
      tl.to("#s09b-col", { filter: "blur(8px)", duration: 0.3, ease: "power2.in" }, 7.8);

      window.__timelines["s09b-any"] = tl;
    })();
  </script>
</template>
