        ["Cash App", "send rent to my roommate on the 1st"], ["Zelle", "Zelle my landlord"],

        ["Chase", "dining spend in October?"], ["Amazon", "reorder my usual"], ["DoorDash", "reorder Friday's Thai"],

        ["Quizlet", "turn my notes into a set and quiz me"], ["Anki", "make cards from this PDF"],
        ["Gradescope", "why did I lose points, draft a regrade"], ["Piazza", "has anyone asked about HW3 Q2?"],
        ["Handshake", "find paid SWE internships in NYC"], ["Instagram", "who haven't I replied to"],
        ["TikTok", "save recipes from my likes"], ["Snapchat", "what did the group plan for Friday"],
        ["GroupMe", "catch me up on 400 unread in the dorm chat"], ["Discord", "summarize unread in my class server"],
        ["WhatsApp", "summarize the family chat"], ["iMessage", "who haven't I answered today"],
        ["Partiful", "invite my roommates Sat 9pm, who RSVP'd?"], ["Life360", "tell me when my sister leaves campus"],
        ["Letterboxd", "log Dune 2, 4 stars"], ["Goodreads", "mark it finished, add the next 3"],

      ];

      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rand = mulberry32(1123);

      for (let i = shuffled.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; }

      // DOM wall: 10 x 8 = 80 cells (3 heroes + 77), nearest cells get the highlighted sentences
      const cells = [];
      for (let r = -4; r <= 3; r++) for (let c = -4; c <= 5; c++) {
        if (r === 0 && c >= 0 && c <= 2) continue;

      cells.sort((a, b) => a.d - b.d);
      const others = $("#s11-others");
      let ni = 0, pi = 0;
      cells.forEach((cell, k) => {
        const key = `${cell.c},${cell.r}`;
        let app;

        else if (ni < NEAR.length) app = NEAR[ni++];
        else app = shuffled[pi++ % shuffled.length];

        el.id = `s11-w${k}`;

        el.innerHTML = `<div class="s11-face"><div class="s11-top">${app[2] ? `<img class="s11-logo" src="assets/apps/${app[2]}.png" alt="" />` : ""}<div class="s11-name"></div></div><div class="s11-say"></div></div>`;
        el.querySelector(".s11-name").textContent = app[0];
        el.querySelector(".s11-say").textContent = app[1];
        others.appendChild(el);
      });

      // far field (canvas): the same tiles past the DOM wall, then every tile shrinks into a dot of the silk wave
      const FAR = shuffled.filter((_, i) => i % 1 === 0);
      const cv = $("#s11-field"), ctx = cv.getContext("2d");
      ctx.font = '500 44px "Inter", sans-serif';
      const wrap = (txt) => { const words = txt.split(" "), lines = []; let line = "";
        for (const w of words) { const t = line ? line + " " + w : w; if (ctx.measureText(t).width > TW - 112 && line) { lines.push(line); line = w; } else line = t; }
        lines.push(line); return lines; };
      const FARL = FAR.map(([n, s]) => [n, wrap(s)]);
      const hash = (c, r) => { let h = Math.imul(c, 374761393) ^ Math.imul(r, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0); };
      const inDom = (c, r) => c >= -4 && c <= 5 && r >= -4 && r <= 3;
      const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

      // camera: log-space pull-back, scale 0.96 -> 0.0085 (tile pitch 940 -> 8 px: the wave's dot pitch is 9 px)
      const S0 = 0.96, S1 = 0.0085, T0 = 0.05, T1 = 5.9;
      const F0 = { x: 1880, y: 0 }, F1 = { x: 1410, y: -330 };
      const D0 = { x: -1880 + S0 * 1880, y: 0 };
      const cam = $("#s11-cam");
      const io = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
      const DOT = 9, DOTD = 4.2;
      // the wave, rendered here first each frame so its light can be read back: the dots inherit the wave's brightness
      const wcv = $("#s11-waves");
      const pw = window.PatternWaves ? PatternWaves.create(wcv, { width: 1920, height: 1080, dpr: 1.5, intro: false }) : null;
      const lum = document.createElement("canvas"); lum.width = 240; lum.height = 135;
      const lctx = lum.getContext("2d", { willReadFrequently: true });
      lctx.imageSmoothingEnabled = true; lctx.imageSmoothingQuality = "high";
      let L = null;
      function frame(t) {
        if (pw) pw.renderAt(81.341 + t);
        const p = Math.min(1, Math.max(0, (t - T0) / (T1 - T0)));
        const e = io(p);
        const s = Math.exp(Math.log(S0) + (Math.log(S1) - Math.log(S0)) * e);
        const fx = F0.x + (F1.x - F0.x) * e, fy = F0.y + (F1.y - F0.y) * e;
        const dx = D0.x * (1 - e), dy = D0.y * (1 - e);
        const x = dx - s * fx, y = dy - s * fy;
        const domA = sstep(0.05, 0.075, s);
        cam.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
        cam.style.transformOrigin = "0 0";
        cam.style.opacity = domA;
        cam.style.visibility = domA <= 0.001 ? "hidden" : "visible";
        // m: tiles -> dots
        const m = sstep(0.045, 0.0135, s);
        const ky = 1 + (PX / PY - 1) * m;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, 1920, 1080);
        if (s > 0.36) return; // the DOM wall covers the frame
        if (m > 0) {
          ctx.fillStyle = `rgba(0,0,0,${m})`; ctx.fillRect(0, 0, 1920, 1080);
          L = null;
          if (pw) { lctx.clearRect(0, 0, 240, 135); lctx.filter = "blur(2.5px)"; lctx.drawImage(wcv, 0, 0, 240, 135); lctx.filter = "none"; L = lctx.getImageData(0, 0, 240, 135).data; }
        }
        const ox = 960 + x, oy = 540 + y; // screen position of local (0,0)
        const cy0 = fy; // vertical stretch around the focus row
        const pyS = PY * s * ky;
        const c0 = Math.floor((0 - ox) / (PX * s)) - 1, c1 = Math.ceil((1920 - ox) / (PX * s)) + 1;
        const rowY = (r) => oy + (cy0 + (r * PY - cy0) * ky) * s;
        const r0 = Math.floor(((0 - oy) / s - cy0) / (PY * ky) + cy0 / PY) - 1;
        const r1 = Math.ceil(((1080 - oy) / s - cy0) / (PY * ky) + cy0 / PY) + 1;
        const drawText = s > 0.03 && m === 0;
        const skipDom = domA >= 0.999;
        for (let r = r0; r <= r1; r++) {
          const sy = rowY(r);
          for (let c = c0; c <= c1; c++) {
            if (skipDom && inDom(c, r)) continue;
            const sx = ox + c * PX * s;
            if (m <= 0) {
              ctx.setTransform(s, 0, 0, s, sx, sy);
              ctx.beginPath();
              ctx.roundRect(-TW / 2, -TH / 2, TW, TH, 56);
              ctx.fillStyle = "#0b0b0b"; ctx.fill();
              ctx.lineWidth = Math.max(1.5, 1 / s); ctx.strokeStyle = "#1f1f1f"; ctx.stroke();
              const [name, lines] = FARL[hash(c, r) % FARL.length];
              if (drawText) {
                ctx.fillStyle = "#fff"; ctx.font = '600 56px "Inter", sans-serif';
                ctx.fillText(name, -TW / 2 + 56, -TH / 2 + 56 + 68);
                ctx.fillStyle = "#a1a1a1"; ctx.font = '500 44px "Inter", sans-serif';
                lines.forEach((ln, i) => ctx.fillText(ln, -TW / 2 + 56, TH / 2 - 56 - 12 - (lines.length - 1 - i) * 53));
              } else {
                ctx.fillStyle = "#3a3a3a"; ctx.fillRect(-TW / 2 + 56, -TH / 2 + 80, 360, 40);
                ctx.fillStyle = "#262626"; ctx.fillRect(-TW / 2 + 56, TH / 2 - 160, 560, 34); ctx.fillRect(-TW / 2 + 56, TH / 2 - 100, 420, 34);
              }
            } else {
              // shrink each tile toward a round dot, brightening toward the wave's ink; edges fade like the shader
              const w = TW * s + (DOTD - TW * s) * m, h = TH * s * 1 + (DOTD - TH * s) * m;
              let light = 0.5;
              if (L) { const lx = Math.min(239, Math.max(0, Math.round(sx / 8))), ly = Math.min(134, Math.max(0, Math.round(sy / 8))); light = Math.min(1, (L[(ly * 240 + lx) * 4] / 255) * 3.2); }
              else { const ex = Math.min(sx, 1920 - sx) / 960, ey = Math.min(sy, 1080 - sy) / 540; light = 0.78 * sstep(0, 0.55, Math.min(ex, ey)); }
              const a = (1 - m) * 0.9 + m * light;
              const g = Math.round(24 + (255 - 24) * m);
              ctx.setTransform(1, 0, 0, 1, 0, 0);
              ctx.fillStyle = `rgba(${g},${g},${g},${a})`;
              ctx.beginPath();
              ctx.roundRect(sx - w / 2, sy - h / 2, w, h, Math.min(w, h) * (0.12 + 0.38 * m));
              ctx.fill();
            }

      tl.fromTo("#s11-dim", { opacity: 0.55 }, { opacity: 0.15, duration: 1.1, ease: "power2.inOut", immediateRender: false }, 4.3);
