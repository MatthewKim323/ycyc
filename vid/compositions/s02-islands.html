  <script>
    (function () {
      const ID = "s02-islands", END = 7.533;
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);
      const SP = KIT.springs, E = KIT.ease.enter;

      // ---- D: the wall flies in from depth, centre-out, already moving on frame 0 (hard cut).
      const tiles = [...document.querySelectorAll(".s02-t")];
      const ctr = (t) => [parseFloat(t.style.left) + 155, parseFloat(t.style.top) + 196];
      const order = tiles.slice().sort((a, b) => {
        const [ax, ay] = ctr(a), [bx, by] = ctr(b);
        return Math.hypot(ax - 960, ay - 556) - Math.hypot(bx - 960, by - 556);
      });
      order.forEach((t, i) => {
        const [cx, cy] = ctr(t), fx = (960 - cx) * 0.45, fy = (556 - cy) * 0.45, t0 = i * 0.032;
        gsap.set(t, { opacity: 0.35, scale: 0.3, x: fx, y: fy, filter: "blur(14px)", transformOrigin: "50% 40%" });
        tl.fromTo(t, { opacity: 0.35, scale: 0.3, x: fx, y: fy, filter: "blur(14px)" },
          { opacity: 1, scale: 1, x: 0, y: 0, filter: "blur(0px)", duration: 0.5, ease: E, immediateRender: false }, t0);
      });
      // camera pushes toward MyFitnessPal (its glyph centre is the origin), bump on the first beat
      gsap.set("#s02-wcam", { transformOrigin: "1115px 292px", scale: 0.9, opacity: 1, filter: "blur(0px)" });
      tl.fromTo("#s02-wcam", { scale: 0.9 }, { scale: 0.97, duration: 0.56, ease: "power2.out", immediateRender: false }, 0);
      tl.fromTo("#s02-wcam", { scale: 0.99 }, { scale: 1, duration: 1.25 - 0.56, ease: "sine.inOut", immediateRender: false }, 0.56);

      // ---- E: dive. The MyFitnessPal tile becomes its data card (shared glyph, the card opens out of the tile).
      const DIVE = 1.25;
      tl.fromTo("#s02-wcam", { scale: 1, opacity: 1, filter: "blur(0px)" }, { scale: 1.45, opacity: 0, filter: "blur(10px)", duration: 0.36, ease: "power2.in", immediateRender: false }, DIVE);
      tl.set("#s02-t-mfp", { visibility: "hidden" }, DIVE);
      const clip = (t, r, b, l, rad) => "inset(" + t + "px " + r + "px " + b + "px " + l + "px round " + rad + "px)";
      gsap.set("#s02-cw-mfp", { opacity: 0 });
      tl.set("#s02-cw-mfp", { opacity: 1 }, DIVE);
      gsap.set("#s02-card-mfp", { clipPath: clip(0, 263, 436, 573, 72) });
      tl.fromTo("#s02-card-mfp", { clipPath: clip(0, 263, 436, 573, 72) }, { clipPath: clip(0, 0, 0, 0, 48), duration: 0.5, ease: SP.layout.ease, immediateRender: false }, DIVE);
      gsap.set("#s02-cg-mfp", { x: 549, y: -24, scale: 1.5714, transformOrigin: "50% 50%" });
      tl.fromTo("#s02-cg-mfp", { x: 549, y: -24, scale: 1.5714 }, { x: 0, y: 0, scale: 1, duration: 0.5, ease: SP.layout.ease, immediateRender: false }, DIVE);
      KIT.reveal(tl, ["#s02-ht-mfp"], 1.6, { y: 24, dur: 0.45 });

      // cards: glyphs, rows tick in on the beats, locks pulse, every hold drifts
      const CARDS = [
        { k: "mfp", rows: [1.93, 2.05, 2.17], pulse: 2.61, hold: [1.5, 3.0] },
        { k: "cro", rows: [3.35, 3.47, 3.59], pulse: 3.97, hold: [3.1, 4.4] },
        { k: "str", rows: [4.71, 4.83, 4.95], pulse: 5.33, hold: [4.5, 6.01] },
      ];
      const pulse = (k, at) => {
        const bars = [1, 2, 3].map((j) => "#s02-b-" + k + j), keys = [1, 2, 3].map((j) => "#s02-k-" + k + j);
        tl.fromTo(bars, { backgroundColor: "#1f1f1f" }, { backgroundColor: "#4a4a4a", duration: 0.08, ease: "power2.out", stagger: 0.04, immediateRender: false }, at);
        tl.fromTo(bars, { backgroundColor: "#4a4a4a" }, { backgroundColor: "#1f1f1f", duration: 0.42, ease: "power2.out", stagger: 0.04, immediateRender: false }, at + 0.08);
        tl.fromTo(keys, { opacity: 0.5 }, { opacity: 1, duration: 0.08, ease: "power2.out", stagger: 0.04, immediateRender: false }, at);
        tl.fromTo(keys, { opacity: 1 }, { opacity: 0.5, duration: 0.42, ease: "power2.out", stagger: 0.04, immediateRender: false }, at + 0.08);
      };
      CARDS.forEach((c) => {
        [1, 2, 3].forEach((j) => KIT.icon(tl, $("#s02-k-" + c.k + j), "one-key"));
        KIT.reveal(tl, [1, 2, 3].map((j) => "#s02-r-" + c.k + j), c.rows[0], { y: 22, dur: 0.45, stagger: 0.12 });
        pulse(c.k, c.pulse);
        gsap.set("#s02-card-" + c.k, { scale: 1, transformOrigin: "50% 50%" });
        tl.fromTo("#s02-card-" + c.k, { scale: 1 }, { scale: 1.035, duration: c.hold[1] - c.hold[0], ease: "sine.inOut", immediateRender: false }, c.hold[0]);
      });

      // ---- F, G: whips along the deck, landing on the beats 3.29 and 4.65 (motion blur only in flight)
      gsap.set("#s02-dcam", { x: 0, filter: "blur(0px)" });
      const whip = (from, to, at, dur) => {
        tl.fromTo("#s02-dcam", { x: from }, { x: to, duration: dur, ease: "power3.inOut", immediateRender: false }, at);
        tl.fromTo("#s02-dcam", { filter: "blur(0px)" }, { filter: "blur(14px)", duration: dur / 2, ease: "power2.in", immediateRender: false }, at);
        tl.fromTo("#s02-dcam", { filter: "blur(14px)" }, { filter: "blur(0px)", duration: dur / 2, ease: "power2.out", immediateRender: false }, at + dur / 2);
      };
      whip(0, -2000, 3.0, 0.29);
      whip(-2000, -4000, 4.38, 0.27);

      // ---- H: the three snap into a fanned stack on 6.01 (headers peek above, Strong in front), locks pulse on 6.69, collapse to the dot.
      const ST = 6.01, SD = 0.5;
      const stack = [
        { k: "mfp", x: 3975, y: -252.4, r: -2.5, s: 0.62 },
        { k: "cro", x: 1990, y: -78.4, r: -1.2, s: 0.66 },
        { k: "str", x: 8, y: 95.6, r: 1.2, s: 0.7 },
      ];
      stack.forEach((c, i) => {
        const el = "#s02-cw-" + c.k;
        gsap.set(el, { x: 0, y: 0, rotation: 0, scale: 1, transformOrigin: "50% 50%" });
        tl.fromTo(el, { x: 0, y: 0, rotation: 0, scale: 1 }, { x: c.x, y: c.y, rotation: c.r, scale: c.s, duration: SD, ease: SP.layout.ease, immediateRender: false }, ST + (2 - i) * 0.03);
        if (c.k !== "str") {
          tl.fromTo(el, { filter: "blur(0px)" }, { filter: "blur(12px)", duration: 0.1, ease: "power2.in", immediateRender: false }, ST + (2 - i) * 0.03);
          tl.fromTo(el, { filter: "blur(12px)" }, { filter: "blur(0px)", duration: 0.22, ease: "power2.out", immediateRender: false }, ST + (2 - i) * 0.03 + 0.1);
        }
      });
      ["mfp", "cro", "str"].forEach((k) => pulse(k, 6.69));

      const C0 = 6.98, CD = 0.3, DOTSCALE = 0.016;
      gsap.set("#s02-collapse", { transformOrigin: "960px 445.6px", scale: 1, opacity: 1 });
      tl.fromTo("#s02-collapse", { scale: 1 }, { scale: DOTSCALE, duration: CD, ease: "power2.in", immediateRender: false }, C0);
      // the stack burns to a white silhouette as it shrinks, so it lands as the dot
      gsap.set("#s02-collapse", { filter: "brightness(1) invert(0)" });
      tl.fromTo("#s02-collapse", { filter: "brightness(1) invert(0)" }, { filter: "brightness(0) invert(1)", duration: 0.17, ease: "power1.in", immediateRender: false }, C0 + 0.1);
      tl.set("#s02-collapse", { opacity: 0 }, C0 + CD);
      gsap.set("#s02-dot", { opacity: 0 });
      tl.set("#s02-dot", { opacity: 1 }, C0 + CD);

      window.__timelines[ID] = tl;
