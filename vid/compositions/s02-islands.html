      tl.fromTo("#s02-collapse", { filter: "brightness(1) invert(0)" }, { filter: "brightness(0) invert(1)", duration: 0.17, ease: "power1.in", immediateRender: false }, C0 + 0.1);
      tl.set("#s02-collapse", { opacity: 0 }, C0 + CD);
