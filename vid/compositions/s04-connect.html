      const E = KIT.ease.enter, SP = KIT.springs;

      // the silk wave, already running, dims under black to 0.55
      KIT.waves(tl, $("#s04-waves"), { from: 0, to: D, offset: 18.779 });
      tl.fromTo("#s04-dim", { opacity: 0 }, { opacity: 0.55, duration: 0.7, ease: "power2.inOut", immediateRender: false }, 0);

      // phone rises on the Welcome screen (outer origin on the MyFitnessPal row so the later push lands there)
      const PO = "130px 297px";
      gsap.set("#s04-phone-w", { transformOrigin: PO, scale: 0.966, y: 1100, filter: "blur(0px)", opacity: 1 });
      tl.fromTo("#s04-phone-w", { y: 1100 }, { y: 0, duration: 0.6, ease: E, immediateRender: false }, 0.05);
      tl.fromTo("#s04-phone-w", { filter: "blur(6px)" }, { filter: "blur(0px)", duration: 0.3, ease: "power2.out", immediateRender: false }, 0.05);
      tl.fromTo("#s04-phone-w", { scale: 0.966 }, { scale: 0.985, duration: 0.35, ease: "sine.inOut", immediateRender: false }, 0.65);
      // Welcome: the shader runs inside the phone, punch toward Continue with Google, press, the screen clears to Pick your first app
      KIT.waves(tl, $("#s04-wel-waves"), { from: 0, to: 0.95, offset: 18.779, width: 402, height: 904, dpr: 2 });
      gsap.set("#s04-phone-p", { transformOrigin: "215px 797px", scale: 1 });
      tl.fromTo("#s04-phone-p", { scale: 1 }, { scale: 1.22, duration: 0.2, ease: "power2.inOut", immediateRender: false }, 0.38);
      tl.fromTo("#s04-tapg", { scale: 0.5, opacity: 0.85 }, { scale: 1.3, opacity: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, 0.55);
      KIT.press(tl, $("#s04-gbtn"), 0.55);
      tl.fromTo("#s04-wel", { opacity: 1, x: 0, filter: "blur(0px)" }, { opacity: 0, x: -60, filter: "blur(8px)", duration: 0.2, ease: "power2.in", immediateRender: false }, 0.7);
      tl.fromTo("#s04-phone-p", { scale: 1.22 }, { scale: 1, duration: 0.3, ease: "power2.inOut", immediateRender: false }, 0.7);
      // tap on the MyFitnessPal row, push follows
      tl.fromTo("#s04-tap", { scale: 0.5, opacity: 0.85 }, { scale: 1.3, opacity: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, 1.02);
      tl.fromTo("#s04-phone-w", { scale: 0.985 }, { scale: 1.8, duration: 0.45, ease: "power2.inOut", immediateRender: false }, 1.04);
      tl.fromTo("#s04-phone-w", { filter: "blur(0px)" }, { filter: "blur(5px)", duration: 0.2, ease: "power2.in", immediateRender: false }, 1.04);
      tl.fromTo("#s04-phone-w", { filter: "blur(5px)", opacity: 1 }, { filter: "blur(8px)", opacity: 0.4, duration: 0.3, ease: "power2.out", immediateRender: false }, 1.24);
      tl.fromTo("#s04-phone-w", { opacity: 0.4 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, 2.15);

      // camera keyframes (origin 0 0)
      gsap.set("#s04-cam", { transformOrigin: "0px 0px", x: 0, y: 0, scale: 1 });
      const cam = (a, b, at, dur, ease) => tl.fromTo("#s04-cam", a, { ...b, duration: dur, ease, immediateRender: false }, at);
      const K1 = { x: -24, y: -235, scale: 1.025 }, K0 = { x: 0, y: 0, scale: 1 };
      const K3 = { x: -16.4, y: -10, scale: 1.02 }, K4 = { x: 164, y: -101.2, scale: 0.8 }, K5 = { x: 139.4, y: -125.2, scale: 0.83 };
      cam(K0, K1, 1.35, 0.8, "sine.inOut");
      cam(K1, K0, 2.15, 0.5, SP.layout.ease);
      cam(K0, K3, 2.65, 1.0, "sine.inOut");
      cam(K3, K4, 3.65, 0.6, SP.layout.ease);
      cam(K4, K5, 4.25, 3.75, "sine.inOut");

      // the connect sheet rises
      gsap.set("#s04-rise", { y: 1000 });
      tl.fromTo("#s04-rise", { y: 1000 }, { y: 0, duration: 0.5, ease: SP.sheet.ease, immediateRender: false }, 1.15);
      tl.fromTo("#s04-rise", { filter: "blur(6px)" }, { filter: "blur(0px)", duration: 0.25, ease: "power2.out", immediateRender: false }, 1.15);
      // lockup slides together (yuzu square into the MyFitnessPal glyph), link joins
      gsap.set("#s04-mark", { x: -60 }); gsap.set("#s04-gl", { x: 60 });
      tl.fromTo("#s04-mark", { x: -60 }, { x: 0, duration: 0.6, ease: SP.enter.ease, immediateRender: false }, 1.3);

      KIT.icon(tl, $("#s04-lk"), "link", { at: 1.63 });
      KIT.words(tl, $("#s04-title"), 1.28, { gap: 4 * KIT.F });
      KIT.reveal(tl, ["#s04-sec", "#s04-foot", "#s04-cont"], 1.4, { y: 30 });
      // Continue
      KIT.press(tl, $("#s04-cont"), 2.0);
      tl.fromTo("#s04-sheet", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in", immediateRender: false }, 2.13);

      // sheet morphs into the build stage
      const sb = (t, r, b, l, rad) => "inset(" + t + "px " + r + "px " + b + "px " + l + "px round " + rad + "px)";
      tl.fromTo("#s04-shell", { clipPath: sb(91, 468.5, 500, 468.5, 60), backgroundColor: "#0b0b0b" },
        { clipPath: sb(110, 628.5, 272, 348.5, 60), backgroundColor: "#000000", duration: 0.5, ease: SP.layout.ease, immediateRender: false }, 2.15);
      tl.fromTo("#s04-shell-b", { clipPath: sb(89.5, 467, 498.5, 467, 61.5) },
        { clipPath: sb(108.5, 627, 270.5, 347, 61.5), duration: 0.5, ease: SP.layout.ease, immediateRender: false }, 2.15);

      // build stage (MyFitnessPal)
      KIT.reveal(tl, ["#s04-f-hero"], 2.3, { y: 36 });
      tl.fromTo("#s04-f-breath", { opacity: 0.35, scale: 1 }, { opacity: 0, scale: 1.35, duration: 1.8, ease: "power2.out", repeat: 2, immediateRender: false }, 2.4);
      KIT.reveal(tl, ["#s04-f-s1", "#s04-f-s2", "#s04-f-s3", "#s04-f-s4"], 2.35, { y: 29 });

      function steps(p, runs, opts) {
        runs.forEach(([r0, r1], i) => {
          const n = i + 1, g = (k) => document.getElementById(p + "-" + k + n), arc = g("a"), ring = g("r"), dot = g("d"), lbl = g("l");
          tl.set(ring, { opacity: 0 }, r0); tl.set(arc, { opacity: 1 }, r0);
          tl.fromTo(arc, { rotation: 0 }, { rotation: (360 * (r1 - r0)) / 0.9, duration: r1 - r0, ease: "none", immediateRender: false }, r0);
          tl.fromTo(lbl, { color: "#6b6b6b" }, { color: "#ffffff", duration: 0.18, ease: "power2.out", immediateRender: false }, r0);
          tl.set(arc, { opacity: 0 }, r1);
          tl.fromTo(dot, { opacity: 1, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.42, ease: SP.pop.ease, immediateRender: false }, r1);
          tl.fromTo(lbl, { color: "#ffffff" }, { color: "#a1a1a1", duration: 0.2, ease: "power2.out", immediateRender: false }, r1);
          KIT.icon(tl, g("k"), "check-black", { at: r1 + 0.04, speed: opts.anim ? 1 : 3 });
        });
      }
      // ticks land on the VO phrases: "Sign in once" / "learns the app" / "checks that it works"
      steps("s04-f", [[2.35, 2.97], [2.97, 3.65], [3.65, 4.33], [4.33, 6.37]], { anim: true });
      tl.fromTo("#s04-f-tools", { opacity: 0, y: 29 }, { opacity: 1, y: 0, duration: 0.6, ease: E, immediateRender: false }, 3.7);
      KIT.reveal(tl, ["#s04-f-t1", "#s04-f-t2", "#s04-f-t3", "#s04-f-t4", "#s04-f-t5"], 3.75, { y: 20 });

      // Cronometer behind, the same flow at 3x
      tl.fromTo("#s04-cw", { opacity: 0, x: 160 }, { opacity: 1, x: 0, duration: 0.6, ease: E, immediateRender: false }, 3.7);
      tl.fromTo("#s04-c-breath", { opacity: 0.35, scale: 1 }, { opacity: 0, scale: 1.35, duration: 0.6, ease: "power2.out", repeat: 6, immediateRender: false }, 3.75);
      steps("s04-c", [[3.75, 3.95], [3.95, 4.15], [4.15, 4.35], [4.35, 4.55]], { anim: false });
      tl.fromTo("#s04-c-tools", { opacity: 0, y: 29 }, { opacity: 1, y: 0, duration: 0.4, ease: E, immediateRender: false }, 4.15);

      // exit: build content clears out of the panel, the panel carries into s05
      tl.fromTo("#s04-f", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power2.in", immediateRender: false }, 7.62);
      tl.fromTo("#s04-cw", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power2.in", immediateRender: false }, 7.6);

      window.__timelines[ID] = tl;
    })();
  </script>
