  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);
      const PITCH = 940;
      const flip = KIT.springs.flip;
      // time inside the flip spring where it crosses 90deg (faces swap there as a backface fallback)
      let half = 0.5;
      for (let p = 0; p <= 1; p += 0.002) { if (flip.ease(p) >= 0.5) { half = p; break; } }

      KIT.waves(tl, $("#s10-waves"), { from: 0, to: 5, offset: 57.284, intro: false });

      const cam = $("#s10-cam");
      const blurK = $("#s10-hblur-k");
      // camera moves: horizontal track with a horizontal-only blur during the move
      function track(from, to, at, dur, ease, peak) {
        tl.fromTo(cam, { x: from }, { x: to, duration: dur, ease, immediateRender: false }, at);
        tl.set(cam, { filter: "url(#s10-hblur)" }, at);
        tl.fromTo(blurK, { attr: { stdDeviation: "0 0" } }, { attr: { stdDeviation: `${peak} 0` }, duration: dur * 0.35, ease: "power2.in", immediateRender: false }, at);
        tl.to(blurK, { attr: { stdDeviation: "0 0" }, duration: dur * 0.5, ease: "power2.out" }, at + dur * 0.4);
        tl.set(cam, { filter: "none" }, at + dur);
      }
      gsap.set(cam, { x: 1300, scale: 1, transformOrigin: "0 0" });
      track(1300, 0, 0.0, 0.6, "expo.out", 8);
      track(0, -PITCH, 1.9, 0.44, "power2.inOut", 7);
      track(-PITCH, -2 * PITCH, 3.29, 0.42, "power2.inOut", 7);
      // hold: slow pull 4% that lands with zero velocity (s11 continues the pull-back from here)
      tl.fromTo(cam, { scale: 1 }, { scale: 0.96, duration: 0.95, ease: "power1.inOut", immediateRender: false }, 4.02);

      // focus: the tile in frame is sharp, its neighbours sit back (blur 8, 40%)
      const tiles = ["#s10-t1", "#s10-t2", "#s10-t3"].map($);
      gsap.set(tiles[0], { opacity: 1, filter: "blur(0px)" });
      gsap.set(tiles.slice(1), { opacity: 0.4, filter: "blur(8px)" });
      const dimT = (el, at) => tl.fromTo(el, { opacity: 1, filter: "blur(0px)" }, { opacity: 0.4, filter: "blur(8px)", duration: 0.4, ease: "power2.inOut", immediateRender: false }, at);
      const focusT = (el, at) => tl.fromTo(el, { opacity: 0.4, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power2.inOut", immediateRender: false }, at);
      dimT(tiles[0], 1.92); focusT(tiles[1], 1.92);
      dimT(tiles[1], 3.31); focusT(tiles[2], 3.31);

      // a tile builds (4 steps flash at its speed), flips on the app's flip spring, then its real tool name smears in
      function build(n, stepAt, step, flipAt) {
        const steps = [...$("#s10-t" + n).querySelectorAll(".s10-step")];
        steps.forEach((s, i) => {
          const t = stepAt + i * step;
          tl.fromTo(s, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: Math.min(0.1, step * 0.6), ease: "power2.out", immediateRender: false }, t);
          if (i < steps.length - 1) tl.fromTo(s, { opacity: 1 }, { opacity: 0, duration: Math.min(0.06, step * 0.3), ease: "power1.in", immediateRender: false }, t + step - Math.min(0.06, step * 0.3));
        });
        gsap.set("#s10-t" + n + "-fill", { scaleX: 0 });
        tl.fromTo("#s10-t" + n + "-fill", { scaleX: 0 }, { scaleX: 1, duration: step * 4, ease: "power1.inOut", immediateRender: false }, stepAt);
        const fl = $("#s10-t" + n + "-flip");
        gsap.set(fl, { rotationY: 0 });
        tl.fromTo(fl, { rotationY: 0 }, { rotationY: 180, duration: flip.dur, ease: flip.ease, immediateRender: false }, flipAt);
        // slight lift while it turns (scale ladder), back to rest on the same spring
        tl.fromTo("#s10-t" + n, { scale: 1 }, { scale: 1.04, duration: flip.dur * 0.45, ease: "power2.out", immediateRender: false }, flipAt);
        tl.to("#s10-t" + n, { scale: 1, duration: flip.dur, ease: KIT.springs.release.ease }, flipAt + flip.dur * 0.45);
        gsap.set("#s10-t" + n + "-back", { opacity: 0 });
        tl.fromTo("#s10-t" + n + "-front", { opacity: 1 }, { opacity: 0, duration: 0.01, immediateRender: false }, flipAt + flip.dur * half);
        tl.fromTo("#s10-t" + n + "-back", { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: false }, flipAt + flip.dur * half);
        KIT.smear(tl, $("#s10-t" + n + "-tool"), flipAt + 0.2);
      }
      // flips start on the music beats (scene-local 1.22 downbeat, 2.59, 3.95 downbeat)
      build(1, 0.40, 0.2, 1.22);
      build(2, 2.17, 0.1, 2.59);
      build(3, 3.73, 0.05, 3.95);

      KIT.icon(tl, $("#s10-t3-ic1"), "apple", { at: 3.5 });
      KIT.icon(tl, $("#s10-t3-ic2"), "apple");

      window.__timelines["s10-more"] = tl;
    })();
  </script>
