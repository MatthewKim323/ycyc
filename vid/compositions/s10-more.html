<template>
  <!-- sfx: t=1.22 name=case-pop gain=0.55 -->
  <!-- sfx: t=2.47 name=riser-tight gain=0.5 -->
  <!-- sfx: t=2.59 name=case-pop gain=0.6 -->
  <!-- sfx: t=3.95 name=case-pop gain=0.7 -->
  <style>
    #root { position: absolute; inset: 0; }
    #s10-dim { position: absolute; inset: 0; background: #000; opacity: 0.55; }
    #s10-cam { position: absolute; left: 960px; top: 540px; width: 0; height: 0; }
    /* the app's AppTile at 4x: 88pt logo -> 352px (radius 0.27 x size), name underneath, a short note while it sets up */
    .s10-tile { position: absolute; width: 760px; height: 520px; top: -260px; display: flex; flex-direction: column; align-items: center; }
    .s10-logo { position: relative; width: 352px; height: 352px; margin-bottom: 16px; perspective: 2400px; flex: none; }
    .s10-flip { position: absolute; inset: 0; transform-style: preserve-3d; }
    .s10-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .s10-face img { width: 352px; height: 352px; border-radius: 95px; display: block; background: #141414; }

    .s10-step, .s10-verb { position: absolute; left: 0; right: 0; top: 0; text-align: center; font: 500 44px/1.2 "Inter", sans-serif; white-space: nowrap; }

  </style>
  <div id="root" data-composition-id="s10-more" data-width="1920" data-height="1080">
    <div id="s10-wrap" class="clip k-canvas" data-start="0" data-duration="5.000" data-track-index="0">
      <svg width="0" height="0" style="position:absolute"><filter id="s10-hblur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur id="s10-hblur-k" stdDeviation="0 0" /></filter></svg>
      <canvas id="s10-waves" class="k-waves" width="1920" height="1080"></canvas>
      <div id="s10-dim"></div>
      <div id="s10-cam" data-layout-allow-overflow>
        <!-- verbs from src/components/app-copy.ts (never tool names on screen) -->
        <div id="s10-t1" class="s10-tile" style="left:-380px">
          <div class="s10-logo">
            <div id="s10-t1-flip" class="s10-flip">
              <div id="s10-t1-front" class="s10-face s10-front"><div class="s10-dimlogo" style="background-image:url('assets/apps/parkmobile.png')"></div></div>
              <div id="s10-t1-back" class="s10-face s10-back"><img src="assets/apps/parkmobile.png" alt="" /></div>
            </div>

          <div class="s10-name">ParkMobile</div>
          <div class="s10-note"><span class="s10-step">Signing in</span><span class="s10-step">Learning the app</span><span class="s10-step">Checking it works</span><span class="s10-step">Ready</span><span id="s10-t1-tool" class="s10-verb">Extend parking</span></div>
        </div>
        <div id="s10-t2" class="s10-tile" style="left:560px">
          <div class="s10-logo">
            <div id="s10-t2-flip" class="s10-flip">
              <div id="s10-t2-front" class="s10-face s10-front"><div class="s10-dimlogo" style="background-image:url('assets/apps/duolingo.png')"></div></div>
              <div id="s10-t2-back" class="s10-face s10-back"><img src="assets/apps/duolingo.png" alt="" /></div>
            </div>
          </div>
          <div class="s10-name">Duolingo</div>
          <div class="s10-note"><span class="s10-step">Signing in</span><span class="s10-step">Learning the app</span><span class="s10-step">Checking it works</span><span class="s10-step">Ready</span><span id="s10-t2-tool" class="s10-verb">Words you keep missing</span></div>
        </div>
        <div id="s10-t3" class="s10-tile" style="left:1500px">
          <div class="s10-logo">
            <div id="s10-t3-flip" class="s10-flip">
              <div id="s10-t3-front" class="s10-face s10-front"><div class="s10-dimlogo" style="background-image:url('assets/apps/cronometer.png')"></div></div>
              <div id="s10-t3-back" class="s10-face s10-back"><img src="assets/apps/cronometer.png" alt="" /></div>
            </div>
          </div>
          <div class="s10-name">Cronometer</div>
          <div class="s10-note"><span class="s10-step">Signing in</span><span class="s10-step">Learning the app</span><span class="s10-step">Checking it works</span><span class="s10-step">Ready</span><span id="s10-t3-tool" class="s10-verb">Check your nutrients</span></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);
      const PITCH = 940;
      const flip = KIT.springs.flip;
      // time inside the flip spring where it crosses 90deg (faces swap there as a backface fallback)
      let half = 0.5;
      for (let p = 0; p <= 1; p += 0.002) { if (flip.ease(p) >= 0.5) { half = p; break; } }

      KIT.waves(tl, $("#s10-waves"), { from: 0, to: 5, offset: 57.284, intro: false });

      const cam = $("#s10-cam");
      const blurK = $("#s10-hblur-k");
      // camera moves: horizontal track with a horizontal-only blur during the move
      function track(from, to, at, dur, ease, peak) {
        tl.fromTo(cam, { x: from }, { x: to, duration: dur, ease, immediateRender: false }, at);
        tl.set(cam, { filter: "url(#s10-hblur)" }, at);
        tl.fromTo(blurK, { attr: { stdDeviation: "0 0" } }, { attr: { stdDeviation: `${peak} 0` }, duration: dur * 0.35, ease: "power2.in", immediateRender: false }, at);
        tl.to(blurK, { attr: { stdDeviation: "0 0" }, duration: dur * 0.5, ease: "power2.out" }, at + dur * 0.4);
        tl.set(cam, { filter: "none" }, at + dur);
      }
      gsap.set(cam, { x: 1300, scale: 1, transformOrigin: "0 0" });
      track(1300, 0, 0.0, 0.6, "expo.out", 8);
      track(0, -PITCH, 1.9, 0.44, "power2.inOut", 7);
      track(-PITCH, -2 * PITCH, 3.29, 0.42, "power2.inOut", 7);
      // hold: slow pull 4% that lands with zero velocity (s11 continues the pull-back from here)
      tl.fromTo(cam, { scale: 1 }, { scale: 0.96, duration: 0.95, ease: "power1.inOut", immediateRender: false }, 4.02);

      // focus: the tile in frame is sharp, its neighbours sit back (blur 8, 40%)
      const tiles = ["#s10-t1", "#s10-t2", "#s10-t3"].map($);
      gsap.set(tiles[0], { opacity: 1, filter: "blur(0px)" });
      gsap.set(tiles.slice(1), { opacity: 0.4, filter: "blur(8px)" });
      const dimT = (el, at) => tl.fromTo(el, { opacity: 1, filter: "blur(0px)" }, { opacity: 0.4, filter: "blur(8px)", duration: 0.4, ease: "power2.inOut", immediateRender: false }, at);
      const focusT = (el, at) => tl.fromTo(el, { opacity: 0.4, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power2.inOut", immediateRender: false }, at);
      dimT(tiles[0], 1.92); focusT(tiles[1], 1.92);
      dimT(tiles[1], 3.31); focusT(tiles[2], 3.31);

      // a tile builds (4 steps flash in its note at its speed), its logo flips from dimmed to full on the app's flip spring, then a plain verb smears in
      function build(n, stepAt, step, flipAt) {
        const steps = [...$("#s10-t" + n).querySelectorAll(".s10-step")];
        steps.forEach((s, i) => {
          const t = stepAt + i * step;
          tl.fromTo(s, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: Math.min(0.1, step * 0.6), ease: "power2.out", immediateRender: false }, t);
          if (i < steps.length - 1) tl.fromTo(s, { opacity: 1 }, { opacity: 0, duration: Math.min(0.06, step * 0.3), ease: "power1.in", immediateRender: false }, t + step - Math.min(0.06, step * 0.3));
        });
        const fl = $("#s10-t" + n + "-flip");
        gsap.set(fl, { rotationY: 0 });
        tl.fromTo(fl, { rotationY: 0 }, { rotationY: 180, duration: flip.dur, ease: flip.ease, immediateRender: false }, flipAt);
        // slight lift while it turns (scale ladder), back to rest on the same spring
        tl.fromTo("#s10-t" + n, { scale: 1 }, { scale: 1.04, duration: flip.dur * 0.45, ease: "power2.out", immediateRender: false }, flipAt);
        tl.to("#s10-t" + n, { scale: 1, duration: flip.dur, ease: KIT.springs.release.ease }, flipAt + flip.dur * 0.45);
        gsap.set("#s10-t" + n + "-back", { opacity: 0 });
        tl.fromTo("#s10-t" + n + "-front", { opacity: 1 }, { opacity: 0, duration: 0.01, immediateRender: false }, flipAt + flip.dur * half);
        tl.fromTo("#s10-t" + n + "-back", { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: false }, flipAt + flip.dur * half);
        // the last step clears as the logo turns; the plain verb smears into the note slot
        tl.fromTo(steps[steps.length - 1], { opacity: 1 }, { opacity: 0, duration: 0.08, ease: "power1.in", immediateRender: false }, flipAt + flip.dur * half - 0.04);
        const verb = $("#s10-t" + n + "-tool");
        tl.fromTo(verb, { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: false }, flipAt + 0.19);
        KIT.smear(tl, verb, flipAt + 0.2, { cps: 40 });
      }
      // flips start on the music beats (scene-local 1.22 downbeat, 2.59, 3.95 downbeat)
      build(1, 0.40, 0.2, 1.22);
      build(2, 2.17, 0.1, 2.59);
      build(3, 3.73, 0.05, 3.95);


      window.__timelines["s10-more"] = tl;
    })();
  </script>
